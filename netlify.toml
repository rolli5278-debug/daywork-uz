# Netlify sozlamalari: GitHub orqali ulanganda qo'lda hech narsa kiritish shart emas.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_TELEGRAM_BOT = "DayWork_notify_bot"

# SPA: /kirish, /profil va boshqa sahifalar yangilanganda 404 bermasin.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
